name: Daily Scrape

on:
  schedule:
    # 05:00 Beijing time (UTC+8) = 21:00 UTC previous day
    # 提前到凌晨5点，即使GitHub延迟2-3小时，早上8点前也能更新完
    - cron: '0 21 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json output/daily_snapshots/
          git diff --staged --quiet || git commit -m "Auto-update: $(date -u '+%Y-%m-%d') data"
          git push
