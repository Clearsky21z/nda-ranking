name: Daily Scrape

on:
  schedule:
    # 08:30 Beijing time (UTC+8) = 00:30 UTC
    - cron: '30 0 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json output/daily_snapshots/
          git diff --staged --quiet || git commit -m "Auto-update: $(date -u '+%Y-%m-%d') data"
          git push
